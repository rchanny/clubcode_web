<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .back-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button a {
            color: white;
            text-decoration: none;
        }

        img {
            border-radius: 50%;
        }

        .profile.details {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>

    <div class="profile details">
        <h2>Profile Details</h2>
        <h3>Profile photo</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxNpXDhReGbWgHFTwkrGEdrDi4OZikaZGViWtkLHcudA&s"
            width="200" height="200" alt="Profile Photo">
        <p>Name: Jane Doe</p>
        <p>Age: 30</p>
        <p>Email: jane.doe@example.com</p>
        <div>
            <button class="back-button">
                <a href="../index.html">Back to Home</a>
            </button>
        </div>
    </div>

</body>

</html>
